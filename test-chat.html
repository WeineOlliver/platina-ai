<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platina AI — Teste Local de Streaming</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --trophy: #e3b341;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    h1 {
      color: var(--trophy);
      margin: 0 0 6px 0;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      color: var(--text-muted);
      margin: 0;
      font-size: 14px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }
    input, textarea {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
    }
    button {
      background: #238636;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .response-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      min-height: 180px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .status {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fb950;
    }
    .dot.streaming {
      background: #e3b341;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏆 Platina AI — Chat Streaming Test</h1>
      <p>Testando endpoint <code>POST /api/v1/chat</code> com Server-Sent Events (SSE) via Groq (120B Model)</p>
    </header>

    <div class="form-group">
      <label for="game">Jogo (Opcional):</label>
      <input type="text" id="game" value="Red Dead Redemption 2" placeholder="Ex: Bloodborne, Elden Ring, RDR2">
    </div>

    <div class="form-group">
      <label for="message">Sua dúvida sobre a platina:</label>
      <textarea id="message" rows="3" placeholder="Digite sua pergunta...">Quais troféus posso perder se não fizer as missões de honra antes do final?</textarea>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <button id="sendBtn" onclick="sendMessage()">🚀 Enviar Pergunta</button>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Pronto</span>
      </div>
    </div>

    <div class="response-box" id="output">Aguardando envio...</div>
  </div>

  <script>
    async function sendMessage() {
      const game = document.getElementById('game').value.trim();
      const message = document.getElementById('message').value.trim();
      const output = document.getElementById('output');
      const sendBtn = document.getElementById('sendBtn');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      if (!message) return;

      sendBtn.disabled = true;
      output.textContent = '';
      statusDot.className = 'dot streaming';
      statusText.textContent = 'Recebendo streaming...';

      try {
        const apiUrl = window.location.origin.startsWith('http') ? '/api/v1/chat' : 'http://localhost:3000/api/v1/chat';
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, game: game || undefined })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`HTTP ${response.status} (${response.statusText}): ${errText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop(); // guarda parte incompleta

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6));
                if (data.type === 'chunk' && data.content) {
                  output.textContent += data.content;
                } else if (data.type === 'error') {
                  output.textContent += '\n[Erro: ' + data.error + ']';
                }
              } catch (e) {
                // não é json válido de evento
              }
            }
          }
        }
        statusText.textContent = 'Concluído';
      } catch (err) {
        output.textContent += '\n❌ Erro: ' + err.message;
        statusText.textContent = 'Erro';
      } finally {
        sendBtn.disabled = false;
        statusDot.className = 'dot';
      }
    }
  </script>
</body>
</html>

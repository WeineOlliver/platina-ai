version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: platina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: platina
      POSTGRES_PASSWORD: platina123
      POSTGRES_DB: platina_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platina -d platina_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: platina_postgres_data
